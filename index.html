    <style>
      /* 加载页的样式写在这里，脚本还没下载完就能显示 */
      html, body { margin: 0; height: 100%; background: #8fd18b; }
      #loading { position: fixed; inset: 0; z-index: 50; background: linear-gradient(#bfe6ff 0 60%, #8fd18b 60%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; font: 14px 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #2a2433; transition: opacity .4s; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading img { width: 128px; height: 128px; image-rendering: pixelated; }
      #loading h1 { margin: 0; font-size: 28px; letter-spacing: 2px; text-shadow: 2px 2px 0 #fff; }
      #loading .bar { width: min(280px, 80vw); height: 14px; border: 2px solid #2a2433; background: #fff; box-shadow: 0 2px 0 #2a2433; box-sizing: border-box; }
      #loading .bar i { display: block; height: 100%; width: 4%; background: #ffb627; transition: width .2s; }
      #loading .note { color: #3a4a3a; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="loading" role="progressbar" aria-label="加载中">
      <img src="icon-192.png" alt="" />
      <h1>像素东大</h1>
